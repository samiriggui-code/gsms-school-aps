<!DOCTYPE html>
<html class="h-full" lang="fr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Maintenance — FORM'SSI</title>
  <meta name="description" content="Mise à jour en cours — CRM FORM'SSI" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --background: #ffffff;
      --foreground: #071437;
      --secondary: #78829d;
      --primary: #1b84ff;
      --primary-hover: #056ee9;
      --badge-border: #1b84ff;
      --badge-text: #1b84ff;
    }
    html.dark {
      --background: #15171c;
      --foreground: #f5f5f5;
      --secondary: #9a9cae;
      --primary: #006ae6;
      --primary-hover: #107eff;
      --badge-border: #006ae6;
      --badge-text: #3e97ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--foreground);
      background: var(--background);
      -webkit-font-smoothing: antialiased;
    }
    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 32rem;
    }
    .illus { margin-bottom: 4rem; }
    .illus img { max-height: 160px; width: auto; }
    .illus .dark-only { display: none; }
    html.dark .illus .light-only { display: none; }
    html.dark .illus .dark-only { display: block; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.625rem;
      margin-bottom: 0.75rem;
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1;
      color: var(--badge-text);
      border: 1px solid var(--badge-border);
      border-radius: 0.375rem;
      background: transparent;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 0 0 2.5rem;
      font-size: 1rem;
      color: var(--secondary);
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 0.375rem;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover { background: var(--primary-hover); }
  </style>
</head>
<body class="antialiased">
  <div class="page">
    <div class="content">
      <div class="illus">
        <img class="light-only" src="media/illustrations/20.svg" alt="" width="280" height="160" />
        <img class="dark-only" src="media/illustrations/20-dark.svg" alt="" width="280" height="160" />
      </div>
      <span class="badge">Maintenance</span>
      <h1>Mise à jour en cours</h1>
      <p class="lead">
        Le CRM FORM'SSI est temporairement indisponible pendant une opération de déploiement.
        Merci de réessayer dans quelques minutes.
      </p>
      <button type="button" class="btn" onclick="location.reload()">Actualiser</button>
    </div>
  </div>
  <script>
    (function () {
      var mode = localStorage.getItem('kt-theme');
      if (!mode && window.matchMedia('(prefers-color-scheme: dark)').matches) mode = 'dark';
      if (mode === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
</body>
</html>
