# Stack GSMS / LMS — Traefik Hostinger (labels Docker, pas de gsms-traefik)
# Usage VPS : /opt/gsms — code : /opt/gsms-school

name: gsms

networks:
  gsms:
    name: gsms

volumes:
  postgres_data:
  redis_data:
  minio_data:
  portainer_data:
  uptime_kuma_data:
  netdata_config:
  netdata_lib:
  netdata_cache:

services:
  maintenance:
    image: nginx:1.27-alpine
    container_name: gsms-maintenance
    restart: unless-stopped
    volumes:
      - ./maintenance:/usr/share/nginx/html:ro
    networks:
      - gsms
    labels:
      "traefik.enable": "true"
      "traefik.http.middlewares.gsms-secure-headers.headers.stsSeconds": "31536000"
      "traefik.http.middlewares.gsms-secure-headers.headers.stsIncludeSubdomains": "true"
      "traefik.http.middlewares.gsms-secure-headers.headers.stsPreload": "true"
      "traefik.http.middlewares.gsms-secure-headers.headers.forceSTSHeader": "true"
      "traefik.http.middlewares.gsms-secure-headers.headers.sslRedirect": "true"
      "traefik.http.routers.gsms-docs-fallback.rule": "Host(`${DOCS_HOST}`)"
      "traefik.http.routers.gsms-docs-fallback.entrypoints": "websecure"
      "traefik.http.routers.gsms-docs-fallback.tls.certresolver": "letsencrypt"
      "traefik.http.routers.gsms-docs-fallback.priority": "1"
      "traefik.http.routers.gsms-docs-fallback.middlewares": "gsms-secure-headers@docker"
      "traefik.http.services.gsms-docs-fallback.loadbalancer.server.port": "80"

  postgres:
    image: postgres:16-alpine
    container_name: gsms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - gsms

  redis:
    image: redis:7-alpine
    container_name: gsms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - gsms

  minio:
    image: minio/minio:latest
    container_name: gsms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - gsms

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: gsms-homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gsms
    labels:
      "traefik.enable": "true"
      "traefik.http.routers.gsms-homepage.rule": "Host(`${MONITORING_HOST}`)"
      "traefik.http.routers.gsms-homepage.entrypoints": "websecure"
      "traefik.http.routers.gsms-homepage.tls.certresolver": "letsencrypt"
      "traefik.http.services.gsms-homepage.loadbalancer.server.port": "3000"

  portainer:
    image: portainer/portainer-ce:latest
    container_name: gsms-portainer
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - gsms
    labels:
      "traefik.enable": "true"
      "traefik.http.routers.gsms-portainer.rule": "Host(`${PORTAINER_HOST}`)"
      "traefik.http.routers.gsms-portainer.entrypoints": "websecure"
      "traefik.http.routers.gsms-portainer.tls.certresolver": "letsencrypt"
      "traefik.http.services.gsms-portainer.loadbalancer.server.port": "9000"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: gsms-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - gsms
    labels:
      "traefik.enable": "true"
      "traefik.http.routers.gsms-uptime.rule": "Host(`${UPTIME_HOST}`)"
      "traefik.http.routers.gsms-uptime.entrypoints": "websecure"
      "traefik.http.routers.gsms-uptime.tls.certresolver": "letsencrypt"
      "traefik.http.services.gsms-uptime.loadbalancer.server.port": "3001"

  netdata:
    image: netdata/netdata:stable
    container_name: gsms-netdata
    restart: unless-stopped
    hostname: ${NETDATA_HOSTNAME}
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gsms
    labels:
      "traefik.enable": "true"
      "traefik.http.routers.gsms-netdata.rule": "Host(`${NETDATA_HOST}`)"
      "traefik.http.routers.gsms-netdata.entrypoints": "websecure"
      "traefik.http.routers.gsms-netdata.tls.certresolver": "letsencrypt"
      "traefik.http.services.gsms-netdata.loadbalancer.server.port": "19999"

  crm:
    profiles: [apps]
    image: gsms-crm:latest
    container_name: gsms-crm
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_ENCODED}@postgres:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_ENCODED}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gsms
    labels:
      "traefik.enable": "true"
      "traefik.http.routers.gsms-crm.rule": "Host(`${CRM_HOST}`)"
      "traefik.http.routers.gsms-crm.entrypoints": "websecure"
      "traefik.http.routers.gsms-crm.tls.certresolver": "letsencrypt"
      "traefik.http.routers.gsms-crm.priority": "10"
      "traefik.http.routers.gsms-crm.middlewares": "gsms-secure-headers@docker"
      "traefik.http.routers.gsms-crm-app.rule": "Host(`app.${DOMAIN}`)"
      "traefik.http.routers.gsms-crm-app.entrypoints": "websecure"
      "traefik.http.routers.gsms-crm-app.tls.certresolver": "letsencrypt"
      "traefik.http.routers.gsms-crm-app.priority": "10"
      "traefik.http.routers.gsms-crm-app.middlewares": "gsms-secure-headers@docker"
      "traefik.http.routers.gsms-crm-app.service": "gsms-crm"
      "traefik.http.routers.gsms-crm-api.rule": "Host(`api.${DOMAIN}`)"
      "traefik.http.routers.gsms-crm-api.entrypoints": "websecure"
      "traefik.http.routers.gsms-crm-api.tls.certresolver": "letsencrypt"
      "traefik.http.routers.gsms-crm-api.priority": "10"
      "traefik.http.routers.gsms-crm-api.middlewares": "gsms-secure-headers@docker"
      "traefik.http.routers.gsms-crm-api.service": "gsms-crm"
      "traefik.http.services.gsms-crm.loadbalancer.server.port": "3001"

  landing:
    profiles: [apps]
    image: gsms-landing:latest
    container_name: gsms-landing
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_ENCODED}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gsms
    labels:
      "traefik.enable": "true"
      "traefik.http.routers.gsms-landing.rule": "Host(`${DOMAIN}`)"
      "traefik.http.routers.gsms-landing-www.rule": "Host(`www.${DOMAIN}`)"
      "traefik.http.routers.gsms-landing-www.entrypoints": "websecure"
      "traefik.http.routers.gsms-landing-www.tls.certresolver": "letsencrypt"
      "traefik.http.routers.gsms-landing-www.priority": "10"
      "traefik.http.routers.gsms-landing-www.middlewares": "gsms-secure-headers@docker"
      "traefik.http.routers.gsms-landing-www.service": "gsms-landing"
      "traefik.http.routers.gsms-landing.entrypoints": "websecure"
      "traefik.http.routers.gsms-landing.tls.certresolver": "letsencrypt"
      "traefik.http.routers.gsms-landing.priority": "10"
      "traefik.http.routers.gsms-landing.middlewares": "gsms-secure-headers@docker"
      "traefik.http.services.gsms-landing.loadbalancer.server.port": "3000"

  docs:
    profiles: [apps]
    image: gsms-docs:latest
    container_name: gsms-docs
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      NODE_ENV: production
      PORT: "3004"
      HOSTNAME: "0.0.0.0"
    networks:
      - gsms
    labels:
      "traefik.enable": "true"
      "traefik.http.routers.gsms-docs.rule": "Host(`${DOCS_HOST}`)"
      "traefik.http.routers.gsms-docs.entrypoints": "websecure"
      "traefik.http.routers.gsms-docs.tls.certresolver": "letsencrypt"
      "traefik.http.routers.gsms-docs.priority": "20"
      "traefik.http.services.gsms-docs.loadbalancer.server.port": "3004"

  worker:
    profiles: [apps]
    image: gsms-worker:latest
    container_name: gsms-worker
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_ENCODED}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gsms
