# Routage Traefik externe (host network)
# App : hosting-global-it-ss.com → 127.0.0.1:3001
# Homepage : monitoring.hosting-global-it-ss.com → 127.0.0.1:3005
http:
  routers:
    app:
      rule: Host(`hosting-global-it-ss.com`) || Host(`www.hosting-global-it-ss.com`)
      entryPoints: [websecure]
      service: app
      tls:
        certResolver: letsencrypt
      priority: 10

    monitoring:
      rule: Host(`monitoring.hosting-global-it-ss.com`)
      entryPoints: [websecure]
      service: homepage
      tls:
        certResolver: letsencrypt

  services:
    app:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:3001
    homepage:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:3005
