# Routage Traefik externe (host network) — domaines injectés par deploy.sh
# Placeholders : __DOMAIN__ __MONITORING_HOST__
http:
  routers:
    app:
      rule: Host(`__DOMAIN__`) || Host(`www.__DOMAIN__`)
      entryPoints: [websecure]
      service: app
      tls:
        certResolver: letsencrypt
      priority: 10

    monitoring:
      rule: Host(`__MONITORING_HOST__`)
      entryPoints: [websecure]
      service: homepage
      tls:
        certResolver: letsencrypt

  services:
    app:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:3001
    homepage:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:3005
