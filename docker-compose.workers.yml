# Worker async LMS (rapports PDF Playwright/Chromium, stats, notifications)
# Prod : voir deploy/gsms/Dockerfile.worker + service worker dans deploy/gsms/docker-compose.yml
services:
  lms-workers:
    build:
      context: .
      dockerfile: deploy/gsms/Dockerfile.worker
    image: gsms-worker:latest
    env_file:
      - .env
    environment:
      REPORT_APP_BASE_URL: ${REPORT_APP_BASE_URL:-http://host.docker.internal:3001}
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /ms-playwright/chromium-1169/chrome-linux/chrome
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    shm_size: "1gb"
    restart: unless-stopped
