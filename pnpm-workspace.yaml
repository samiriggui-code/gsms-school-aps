packages:
  - 'apps/*'
  - '!apps/old-landing'
  - 'packages/*'

allowBuilds:
  '@homebridge/node-pty-prebuilt-multiarch': true
  '@prisma/client': true
  '@prisma/engines': true
  '@puppeteer/browsers': true
  '@sentry/cli': true
  bcrypt: true
  core-js: true
  esbuild: true
  keytar: true
  msw: true
  node-pty: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

overrides:
  '@types/react': 19.2.3
  '@types/react-dom': 19.2.3

patchedDependencies:
  next-themes@0.4.6: patches/next-themes@0.4.6.patch
